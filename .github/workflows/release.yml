name: Release

# Pushing a tag such as `v0.1.0` publishes that version to npm and GitHub
# Packages and creates a GitHub release with the packed tarball attached.
# A version with a prerelease suffix (`v0.2.0-beta.1`) is published under the
# `next` dist-tag and marked as a prerelease on GitHub; anything else goes to
# `latest`. Re-running the workflow for a version that is already on a
# registry skips that publish instead of failing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm typecheck
      - run: bun test
      - run: pnpm build

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance; requires the repository to be public
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # NPM_TOKEN is a repository secret the owner must add under Settings >
      # Secrets and variables > Actions. Use an npm *granular access token*
      # with read and write (publish) access to `shuttle-editor`, an expiry
      # date, and "bypass 2FA" enabled if the npm account requires 2FA. Once
      # the package exists on npm, replace the token with npm Trusted
      # Publishing (OIDC), which needs no stored secret.
      #
      # `--provenance` only works from a public repository. `prepack` builds
      # dist/ before the tarball is made. The auth line is written to this
      # checkout's own .npmrc (never committed) so pnpm and `npm view` both
      # read it; npm expands ${NODE_AUTH_TOKEN} from the environment.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1 && { echo "$NAME@$VERSION already published to npm"; exit 0; }
          tag=latest; case "$VERSION" in *-*) tag=next;; esac
          pnpm publish --no-git-checks --access public --provenance --tag "$tag"

  publish-github:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@cord-note'
      - run: pnpm install --frozen-lockfile
      # GitHub Packages only accepts npm packages scoped to the repository
      # owner, so the same build is published there as @cord-note/shuttle.
      # The rename happens only in this job's checkout and is never committed.
      - run: npm pkg set name=@cord-note/shuttle
      # GitHub Packages needs auth even for `npm view`; the .npmrc lines give
      # both the lookup and the publish the scope's registry and the token.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@cord-note:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          npm view "$NAME@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1 && { echo "$NAME@$VERSION already published to GitHub Packages"; exit 0; }
          tag=latest; case "$VERSION" in *-*) tag=next;; esac
          pnpm publish --no-git-checks --registry https://npm.pkg.github.com --tag "$tag"

  github-release:
    needs: [publish-npm, publish-github]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          set --
          case "$VERSION" in *-*) set -- --prerelease;; esac
          gh release create "$GITHUB_REF_NAME" *.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "$@"
